services:
  db:
    image: postgres:15-alpine
    container_name: refuel_planner_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optimal_refuel_planner}
      POSTGRES_USER: ${POSTGRES_USER:-optimal_refuel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optimal_refuel_user} -d ${POSTGRES_DB:-optimal_refuel_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - refuel_planner

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: refuel_planner_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - refuel_planner

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refuel_planner_web
    command: >
      sh -c "python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    # gunicorn refuel_planner.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}" normal
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - refuel_planner
    environment:
      - HOME=/tmp

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refuel_planner_celery_worker
    command: celery -A refuel_planner worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A refuel_planner inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - refuel_planner

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refuel_planner_celery_beat
    command: celery -A refuel_planner beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f celerybeat-schedule || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - refuel_planner

volumes:
  postgres_data:
  rabbitmq_data:
  static_volume:

networks:
  refuel_planner:
    driver: bridge